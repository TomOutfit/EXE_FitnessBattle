name: fitness_battle
description: Fitness Battle - Gamified Fitness Tracking App
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^14.8.1
  
  # UI Components
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.5
  fl_chart: ^0.70.2
  
  # Camera and ML
  camera: ^0.11.0+2
  google_mlkit_pose_detection: ^0.13.0
  permission_handler: ^11.3.1
  
  # Sensors & Location
  pedometer: ^4.0.2
  geolocator: ^13.0.2
  sensors_plus: ^6.1.1
  flutter_tts: ^4.2.2
  
  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  
  # Storage & Database
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Utils
  intl: ^0.20.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
